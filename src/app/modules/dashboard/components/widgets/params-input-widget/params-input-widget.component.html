<form *ngIf="isFormLoaded && inputForm" [formGroup]="inputForm" (ngSubmit)="showSupplyVisibility()">
    <div class="widget">
      <header class="drag-handler">
        <div class="headers">
          <h2 title="{{ dashboardPanelModel.title ? dashboardPanelModel.title : 'paramsInput.title' | translate }}">
            {{
              dashboardPanelModel.title ? dashboardPanelModel.title : "'paramsInput.title' | translate"
            }}
          </h2>
        </div>
        <div class="icons">
        </div>
      </header>
      <div class="widget-content">
          <mat-form-field class="">
            <textarea formControlName="partNumber" matInput placeholder="{{ 'paramsInput.partNumber' | translate }}"></textarea>
          </mat-form-field>
          <div class="vc-weeks-days">
            <mat-form-field class="">
              <input
                formControlName="vendorCode"
                matInput
                maxlength="256"
                placeholder="{{ 'paramsInput.vendorCode' | translate }}" />
            </mat-form-field>
  
            <mat-form-field *ngIf="showWeeks" class="">
              <mat-label>{{ 'paramsInput.weeks' | translate }}</mat-label>
              <mat-select formControlName="weeks" required>
                <mat-option *ngFor="let weeksItem of weeksRange" [value]="weeksItem">
                  {{ weeksItem }}
                </mat-option>
              </mat-select>
            </mat-form-field>
  
            <mat-form-field *ngIf="!showWeeks" class="">
              <mat-label>{{ 'paramsInput.days' | translate }}</mat-label>
              <mat-select formControlName="days" required>
                <mat-option *ngFor="let days of daysRange" [value]="days">
                  {{ days }}
                </mat-option>
              </mat-select>
            </mat-form-field>
  
            <button type="button" mat-icon-button [disabled]="!vendorCode" (click)="onClick()"
                    [matTooltip]="showWeeks ? 'View Days' : 'View Weeks'">
              <mat-icon> {{ (showWeeks) ? 'view_day' : 'view_week' }} </mat-icon>
            </button>
          </div>
  
          <mat-form-field class="">
            <mat-label>View</mat-label>
            <mat-select formControlName="view" required>
              <mat-option *ngFor="let viewItem of mmViews$ | async" [value]="viewItem.id">
                {{ viewItem.configurationName }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      <footer>
        <div class="footer-left">
          <button *ngIf="!visibility.onDashboard" class="no-left-padding" [matMenuTriggerFor]="menu" mat-button>
            <span class="material-symbols-outlined">settings</span>
          </button>
          <div class="piw--spinner-wrapper" *ngIf="loading">
            <orion-platform-progress-spinner class="piw--spinner"> </orion-platform-progress-spinner>
          </div>
        </div>
        <div class="counts"></div>
        <div class="footer-right">
          <button
            id="submit"
            type="submit"
            color="primary"
            [disabled]="!inputForm.valid || loading"
            class="input-widget--actions--btn"
            mat-raised-button>
            {{ 'paramsInput.search' | translate }}
          </button>
        </div>
      </footer>
    </div>
    <mat-menu #menu="matMenu" [overlapTrigger]="true" class="workflow-card--mat-menu">
      <button mat-menu-item (click)="configureWidget()">
        <mat-icon>settings</mat-icon>
        <span>Configure</span>
      </button>
      <button mat-menu-item (click)="deleteWidget()">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </button>
    </mat-menu>
  </form>
