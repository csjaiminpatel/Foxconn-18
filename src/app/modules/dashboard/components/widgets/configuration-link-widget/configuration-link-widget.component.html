<div class="widget">
    <header class="drag-handler">
      <div class="headers">
        <h2 title="{{ dashboardPanelModel.title ? dashboardPanelModel.title : title }}">
          {{ dashboardPanelModel.title ? dashboardPanelModel.title : title }}
        </h2>
        <!--<ng-container *ngIf="dashboardPanelModel.subTitle">
          <h3>
            {{ dashboardPanelModel.subTitle }}
          </h3>
        </ng-container>-->
      </div>
    </header>
    <div class="widget-content">
      <div class="link-icon">
        <a
          fxLayout="row"
          fxLayoutAlign="center center"
          (click)="navigateTo(link)"
          (mousedown)="middleClickHandle($event,link)">
          <mat-icon class="logo" svgIcon="{{ icon }}"> </mat-icon>
        </a>
      </div>
    </div>
    <footer>
      <div class="footer-left"></div>
      <div class="counts"></div>
      <div class="footer-right"></div>
    </footer>
    <ng-container *ngIf="visibility.onDashboard">
      <button class="settings-icon" [disabled]="!visibility.onDashboard" [matMenuTriggerFor]="menu" mat-button>
        <span class="material-symbols-outlined">settings</span>
      </button>
    </ng-container>
  </div>
    <mat-menu #menu="matMenu" [overlapTrigger]="true" class="workflow-card--mat-menu">
      <button mat-menu-item (click)="configureWidget()">
        <mat-icon>settings</mat-icon>
        <span>{{ 'global.configure' | translate }}</span>
      </button>
      <button mat-menu-item (click)="deleteWidget()">
        <mat-icon>delete</mat-icon>
        <span>{{ 'global.delete' | translate }}</span>
      </button>
    </mat-menu>
