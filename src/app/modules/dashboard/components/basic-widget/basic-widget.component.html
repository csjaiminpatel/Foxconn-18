<mat-card class="dashboard-card" [ngClass]="widgetClass">
    <mat-card-header class="dashboard-card--header">
      <mat-card-title class="dashboard-card--title"> {{ title }} </mat-card-title>
      <mat-card-subtitle class="dashboard-card--subtitle">
        {{ subtitle }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="dashboard-card--content">
      <a (click)="navigateTo(link)">
        <mat-icon class="logo" svgIcon="{{ icon }}"> </mat-icon>
      </a>
      <span disabled class="version">{{ version }}</span>
    </mat-card-content>
  </mat-card>
